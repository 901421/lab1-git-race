# Application Configuration
spring.application.name=modern-web-app
server.port=8080

# A locale without its own messages file (e.g. fr) falls back to the base
# messages.properties, not to the messages of the server's OS/JVM locale.
# Which locale is requested at all is decided in WebConfig.
spring.messages.fallback-to-system-locale=false

# Greeting history (bonus): H2 stored in a file so it survives a restart
spring.datasource.url=jdbc:h2:file:./data/greetings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Connection pool (HikariCP, the default in Spring Boot).
# Several requests can store or read greetings at the same time:
# each one takes a connection from the pool and gives it back
# when its query ends.
spring.datasource.hikari.pool-name=greetings-pool
spring.datasource.hikari.maximum-pool-size=10

# Logging Configuration
logging.level.org.springframework=INFO
logging.level.es.unizar.webeng=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true


# Resource caching disabled for development
spring.resources.cache.cachecontrol.no-store=true

# Spring Boot DevTools Configuration
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.livereload.port=35729

spring.web.resources.chain.cache=false
spring.thymeleaf.cache=false